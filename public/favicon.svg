      <stop offset="0" stop-color="#3f7fd6"/>
      <stop offset="1" stop-color="#2f9e7a"/>
    </linearGradient>
  </defs>
  <rect width="56" height="56" rx="14" fill="url(#g)"/>
  <g fill="#fff">
    <!-- plus -->
    <rect x="12" y="17" width="12" height="3.2" rx="1.6"/>
    <rect x="16.4" y="12.6" width="3.2" height="12" rx="1.6"/>
    <!-- minus -->
    <rect x="32" y="17" width="12" height="3.2" rx="1.6"/>
    <!-- times -->
    <rect x="12" y="35.4" width="12" height="3.2" rx="1.6" transform="rotate(45 18 37)"/>
    <rect x="12" y="35.4" width="12" height="3.2" rx="1.6" transform="rotate(-45 18 37)"/>
    <!-- divide -->
    <rect x="32" y="35.4" width="12" height="3.2" rx="1.6"/>
    <circle cx="38" cy="31" r="1.9"/>
    <circle cx="38" cy="43" r="1.9"/>
